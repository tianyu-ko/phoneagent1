name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project schemes
        run: |
          xcodebuild \
            -project PhoneAgent.xcodeproj \
            -list

      - name: Build PhoneAgent for iOS Simulator
        run: |
          set -o pipefail

          xcodebuild \
            -project PhoneAgent.xcodeproj \
            -scheme PhoneAgent \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PhoneAgent-simulator-app
          path: DerivedData/Build/Products/Debug-iphonesimulator/PhoneAgent.app